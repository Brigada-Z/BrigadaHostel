<div class="not-found-container">
  <div class="not-found-card">
    <div class="not-found-badge">
      <span class="status-code">404</span>
      <span class="badge-text">Página No Encontrada</span>
    </div>

    <div class="not-found-icon">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <h1 class="not-found-title">¡Ups! Parece que te has extraviado</h1>
    <p class="not-found-desc">
      La dirección a la que intentas acceder no existe en <strong>Brigada Hostel</strong> o ha sido trasladada a una nueva ubicación.
    </p>

    <div class="not-found-actions">
      <button type="button" (click)="goBack()" class="btn-outline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Regresar Atrás
      </button>

      <a routerLink="/home" class="btn-premium">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Ir al Inicio
      </a>
    </div>

    <div class="quick-links">
      <p class="quick-links-title">Otras secciones recomendadas:</p>
      <div class="quick-links-list">
        <a routerLink="/quienes-somos" class="quick-link-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Quiénes Somos
        </a>
        <a routerLink="/auth/login" class="quick-link-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Acceso al Panel
        </a>
        <a routerLink="/dashboard/admin/resumen" class="quick-link-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Dashboard Admin
        </a>
        <a routerLink="/dashboard/usuario/resumen" class="quick-link-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Portal Huésped
        </a>
      </div>
    </div>
  </div>
</div>
