<div class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="brand-logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>

      <div class="auth-header">
        <h1>Acceso al Panel</h1>
        <p>Ingresa tus datos para continuar</p>
      </div>

      <!-- Selector de Rol Demo -->
      <div class="mb-4">
        <label class="auth-label">Rol de Acceso Demo</label>
        <div class="d-flex gap-2">
          <button 
            type="button" 
            class="btn flex-1 py-2 rounded-3 text-sm font-weight-800"
            [class.btn-dark]="selectedRole === 'admin'"
            [class.btn-outline-secondary]="selectedRole !== 'admin'"
            (click)="selectedRole = 'admin'">
            Administrador
          </button>
          <button 
            type="button" 
            class="btn flex-1 py-2 rounded-3 text-sm font-weight-800"
            [class.btn-dark]="selectedRole === 'usuario'"
            [class.btn-outline-secondary]="selectedRole !== 'usuario'"
            (click)="selectedRole = 'usuario'">
            Usuario Huésped
          </button>
        </div>
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="auth-label">Usuario</label>
          <input 
            type="text" 
            class="input-field" 
            placeholder="Ingresa tu usuario (ej: admin / 1234)" 
            [(ngModel)]="username" 
            name="username" 
            required>
        </div>
        <div class="form-group mt-20">
          <label class="auth-label">Contraseña</label>
          <input 
            type="password" 
            class="input-field" 
            placeholder="••••••••" 
            [(ngModel)]="password" 
            name="password" 
            required>
          <a routerLink="/dashboard/auth/forgot-password" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="btn-submit mt-24">
          Iniciar sesión 
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="auth-footer">
        ¿No tienes cuenta? <a routerLink="/dashboard/auth/signup">Crear una ahora</a>
      </div>
    </div>
  </div>

  <a routerLink="/home" class="back-home" title="Volver al inicio">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      <polyline points="9 22 9 12 15 12 15 22"></polyline>
    </svg>
  </a>
</div>
